<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EA" />
  <title>Manakeesh Corner — Order</title>
  <meta name="description" content="Order from Manakeesh Corner. Your favourites, one click away." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C6A15B;
      --gold-deep: #8C6A2E;
      --gold-soft: #E8D5A8;
      --ink: #1C1712;
      --muted: #6E6458;
      --paper: #F7F3EA;
      --white: #FFFFFF;
      --line: rgba(140, 106, 46, 0.16);
      --shadow: 0 10px 30px rgba(48, 32, 8, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Outfit, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 420px at 50% -80px, #fff 0%, transparent 60%),
        var(--paper);
      color: var(--ink);
      min-height: 100dvh;
    }
    .wrap {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 18px 16px 36px;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero {
      position: relative;
      background: linear-gradient(180deg, #fff 0%, #FBF7EF 100%);
      padding: 22px 20px 8px;
      text-align: center;
    }
    .mark {
      width: min(280px, 86%);
      height: auto;
      margin: 4px auto 8px;
      display: block;
    }
    .hero img.photo {
      width: calc(100% - 8px);
      height: 210px;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      margin: 0 auto 14px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 0.01em;
      margin: 0;
      line-height: 1;
    }
    .tag {
      margin: 8px 0 0;
      color: var(--gold-deep);
      font-size: 15px;
      letter-spacing: 0.01em;
    }
    .offer {
      margin: 14px 20px 0;
      background: linear-gradient(90deg, #F8EFD8, #FFF);
      border: 1px solid var(--gold-soft);
      color: var(--gold-deep);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      text-align: center;
    }
    .section { padding: 18px 16px 8px; }
    h2 {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin: 4px 4px 12px;
      text-align: center;
    }
    .branch-grid, .links, .secondary { display: grid; gap: 10px; }
    button.branch, a.btn {
      appearance: none;
      text-decoration: none;
      border: 0;
      width: 100%;
      min-height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      font: 600 16px/1.2 Outfit, sans-serif;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    button.branch:active, a.btn:active { transform: scale(0.985); }
    a.btn:hover, button.branch:hover {
      border-color: var(--gold);
      box-shadow: 0 8px 18px rgba(140, 106, 46, 0.12);
      transform: translateY(-1px);
    }
    a.btn.primary {
      min-height: 70px;
      border-color: transparent;
    }
    a.btn.primary small,
    a.btn.primary .chev {
      color: inherit;
      opacity: 0.88;
    }
    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      color: #fff;
      overflow: hidden;
    }
    .logo-badge svg { width: 26px; height: 26px; display: block; }
    .btn-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .btn-copy small { font-weight: 500; color: var(--muted); font-size: 12px; }
    .chev { margin-left: auto; color: var(--gold-deep); opacity: .7; }
    .secondary a.btn { min-height: 54px; background: #FFFcf7; font-weight: 500; }
    footer {
      padding: 8px 16px 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    footer a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--gold-deep);
      background: #fff;
    }
    .back {
      background: none;
      border: 0;
      color: var(--gold-deep);
      font: 600 14px Outfit, sans-serif;
      padding: 0 4px 8px;
      cursor: pointer;
    }
    .hidden { display: none !important; }
    .stats {
      margin: 16px;
      background: #fff;
      border: 1px dashed var(--gold);
      border-radius: 16px;
      padding: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .stats table { width: 100%; border-collapse: collapse; }
    .stats td { padding: 4px 0; }
    .stats td:last-child { text-align: right; color: var(--ink); font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
      a.btn, button.branch { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card" id="app"></article>
  </div>
  <script id="site-config" type="application/json">
  {
    "name": "Manakeesh Corner",
    "tagline": "Your favourites, one click away.",
    "logoUrl": "logo.jpg",
    "heroImage": "hero.jpg",
    "offer": "",
    "menuUrl": "",
    "phone": "",
    "instagram": "https://www.instagram.com/manakeeshcorneruae/",
    "facebook": "",
    "analyticsId": "",
    "branches": [
      {
        "id": "motor-city",
        "name": "Motor City",
        "area": "Dubai",
        "maps": "https://www.google.com/maps?q=25.043361,55.2295",
        "orderDirect": "",
        "talabat": "https://www.talabat.com/uae/mankeesh-corner-motor-city",
        "deliveroo": "https://deliveroo.ae/menu/dubai/motor-city/manakeesh-corner-sports-city?utm_campaign=organic&utm_medium=referrer&utm_source=menu_share",
        "careem": "https://link.careem.com/0GyUhNgoBE6ik",
        "noon": "https://food.noon.com/en-ae/outlet/MNKSHCF902",
        "whatsapp": ""
      }
    ]
  }
  </script>
  <script>
    const CONFIG = JSON.parse(document.getElementById("site-config").textContent);
    const PLATFORMS = [
      { key: "orderDirect", label: "Order Direct", hint: "From the restaurant", color: "#8C6A2E", ink: "#fff", badge: "#fff", badgeInk: "#8C6A2E" },
      { key: "talabat", label: "Talabat", hint: "Delivery", color: "#FF5A00", ink: "#fff", badge: "#fff", badgeInk: "#FF5A00" },
      { key: "deliveroo", label: "Deliveroo", hint: "Delivery", color: "#00CCBC", ink: "#04332F", badge: "#fff", badgeInk: "#008C80" },
      { key: "careem", label: "Careem", hint: "Delivery", color: "#00E784", ink: "#062117", badge: "#062117", badgeInk: "#00E784" },
      { key: "noon", label: "Noon Food", hint: "Delivery", color: "#FEEE00", ink: "#111111", badge: "#111111", badgeInk: "#FEEE00" },
      { key: "whatsapp", label: "Order on WhatsApp", hint: "Chat to order", color: "#25D366", ink: "#062117", badge: "#fff", badgeInk: "#128C7E" }
    ];

    function source() {
      const q = new URLSearchParams(location.search);
      const utm = q.get("utm_source") || q.get("src");
      if (utm) return utm.toLowerCase();
      const ref = (document.referrer || "").toLowerCase();
      if (ref.includes("instagram")) return "instagram";
      if (ref.includes("facebook") || ref.includes("fb.com")) return "facebook";
      if (ref.includes("whatsapp") || ref.includes("wa.me")) return "whatsapp";
      if (ref.includes("t.co") || ref.includes("twitter") || ref.includes("x.com")) return "x";
      return ref ? "referral" : "direct";
    }

    function track(platform, branch) {
      const event = { platform, branch, source: source(), at: new Date().toISOString() };
      try {
        const key = "mc_clicks";
        const all = JSON.parse(localStorage.getItem(key) || "[]");
        all.push(event);
        localStorage.setItem(key, JSON.stringify(all.slice(-500)));
      } catch (e) {}
      if (CONFIG.analyticsId && window.gtag) {
        gtag("event", "order_click", { platform, branch, traffic_source: event.source });
      }
    }

    function withSource(url) {
      try {
        const u = new URL(url);
        if (!u.searchParams.get("utm_source")) u.searchParams.set("utm_source", "manakeesh_link");
        if (!u.searchParams.get("utm_medium")) u.searchParams.set("utm_medium", source());
        return u.toString();
      } catch (e) { return url; }
    }

    function logoSvg(key) {
      const paths = {
        orderDirect: '<path d="M6 18h12M8 18V9l4-4 4 4v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        talabat: '<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 12.5l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        deliveroo: '<path d="M5 16c2-6 4-8 7-8s5 2 7 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="8" r="1.4" fill="currentColor"/>',
        careem: '<path d="M5 15c1.5-5 3.2-7 7-7s5.5 2 7 7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 15h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        noon: '<circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        whatsapp: '<path d="M7 16.5 6 19l2.6-1A7 7 0 1 0 7 16.5z" fill="none" stroke="currentColor" stroke-width="1.6"/>',
        maps: '<path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="11" r="2" fill="currentColor"/>',
        menu: '<path d="M7 6h10M7 12h10M7 18h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        phone: '<path d="M8 5h2l1 3-1.5 1a11 11 0 0 0 5 5L16 12.5l3 1v2a2 2 0 0 1-2 2A13 13 0 0 1 6 7a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.5"/>'
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[key] || ""}</svg>`;
    }

    function brandMark() {
      if (CONFIG.logoUrl) return `<img class="mark" src="${CONFIG.logoUrl}" alt="${CONFIG.name} logo" />`;
      return `<svg class="mark" viewBox="0 0 72 72" aria-label="${CONFIG.name} logo">
        <circle cx="36" cy="36" r="34" fill="#F8EFD8" stroke="#C6A15B" stroke-width="2"/>
        <path d="M22 44c4-14 8-18 14-18s10 4 14 18" fill="none" stroke="#8C6A2E" stroke-width="2.2"/>
        <circle cx="36" cy="27" r="3" fill="#C6A15B"/>
        <text x="36" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8C6A2E">MC</text>
      </svg>`;
    }

    function hero() {
      if (CONFIG.heroImage) return `<img class="photo" src="${CONFIG.heroImage}" alt="Manakeesh from ${CONFIG.name}" />`;
      return `<svg class="photo" viewBox="0 0 640 300" role="img" aria-label="Fresh manakeesh">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8EFD8"/><stop offset="1" stop-color="#E7D3A2"/></linearGradient>
        </defs>
        <rect width="640" height="300" rx="20" fill="url(#bg)"/>
        <ellipse cx="250" cy="168" rx="118" ry="78" fill="#C9843A"/>
        <ellipse cx="250" cy="160" rx="104" ry="66" fill="#E7B15A"/>
        <ellipse cx="250" cy="156" rx="86" ry="50" fill="#6E8B3D"/>
        <ellipse cx="430" cy="176" rx="110" ry="72" fill="#D7A15A"/>
        <ellipse cx="430" cy="168" rx="96" ry="58" fill="#F3D48A"/>
        <path d="M360 150c20 8 40 8 70-4" fill="none" stroke="#fff6" stroke-width="6"/>
      </svg>`;
    }

    const app = document.getElementById("app");
    let branch = CONFIG.branches.length === 1 ? CONFIG.branches[0] : null;

    function render() {
      const showStats = new URLSearchParams(location.search).has("stats");
      const social = [
        CONFIG.instagram && { href: CONFIG.instagram, label: "Instagram", icon: "ig" },
        CONFIG.facebook && { href: CONFIG.facebook, label: "Facebook", icon: "fb" }
      ].filter(Boolean);

      const head = `
        <header class="hero">
          ${hero()}
          ${brandMark()}
          <h1>${CONFIG.name}</h1>
          <p class="tag">${CONFIG.tagline}</p>
        </header>
        ${CONFIG.offer ? `<div class="offer">${CONFIG.offer}</div>` : ""}`;

      let body = "";
      if (!branch) {
        body = `<section class="section">
          <h2>Choose your branch</h2>
          <div class="branch-grid">
            ${CONFIG.branches.map((b, i) => `<button class="branch" data-i="${i}"><span class="logo-badge" style="background:#8C6A2E">${logoSvg("maps")}</span><span class="btn-copy">${b.name}<small>${b.area || ""}</small></span><span class="chev">›</span></button>`).join("")}
          </div>
        </section>`;
      } else {
        const buttons = PLATFORMS.filter(p => branch[p.key]).map(p => `
          <a class="btn primary" data-platform="${p.key}" href="${withSource(branch[p.key])}" target="_blank" rel="noopener" style="background:${p.color};color:${p.ink};border-color:${p.color}">
            <span class="logo-badge" style="background:${p.badge};color:${p.badgeInk}">${logoSvg(p.key)}</span>
            <span class="btn-copy">${p.label}<small>${p.hint}</small></span>
            <span class="chev">›</span>
          </a>`).join("");
        const extras = [
          CONFIG.menuUrl && `<a class="btn" href="${CONFIG.menuUrl}" target="_blank" rel="noopener"><span class="logo-badge" style="background:#F3E6C8;color:#8C6A2E">${logoSvg("menu")}</span><span class="btn-copy">View Menu</span></a>`,
          branch.maps && `<a class="btn" data-platform="maps" href="${branch.maps}" target="_blank" rel="noopener"><span class="logo-badge" style="background:#F3E6C8;color:#8C6A2E">${logoSvg("maps")}</span><span class="btn-copy">Find Us on Google Maps<small>${branch.name}</small></span></a>`,
          CONFIG.phone && `<a class="btn" data-platform="call" href="tel:${CONFIG.phone}"><span class="logo-badge" style="background:#F3E6C8;color:#8C6A2E">${logoSvg("phone")}</span><span class="btn-copy">Call Us<small>${CONFIG.phone}</small></span></a>`
        ].filter(Boolean).join("");
        body = `<section class="section">
          ${CONFIG.branches.length > 1 ? `<button class="back" id="back">← All branches</button>` : ""}
          <h2>Choose your platform to order</h2>
          <div class="links">${buttons}</div>
          <div class="secondary" style="margin-top:10px">${extras}</div>
        </section>`;
      }

      const foot = social.length ? `<footer>${social.map(s => `<a href="${s.href}" target="_blank" rel="noopener" aria-label="${s.label}">${s.icon === "ig" ? instagram() : facebook()}</a>`).join("")}</footer>` : "";
      app.innerHTML = head + body + foot + (showStats ? statsHtml() : "");
      bind();
    }

    function instagram() {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>`;
    }
    function facebook() {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h2.6l.4-3H13v-2c0-.6.4-1 1-1z"/></svg>`;
    }
    function statsHtml() {
      let all = [];
      try { all = JSON.parse(localStorage.getItem("mc_clicks") || "[]"); } catch (e) {}
      const counts = {};
      all.forEach(e => {
        const k = `${e.platform} · ${e.source}`;
        counts[k] = (counts[k] || 0) + 1;
      });
      const rows = Object.entries(counts).map(([k, n]) => `<tr><td>${k}</td><td>${n}</td></tr>`).join("") || `<tr><td>No clicks on this device yet</td><td>0</td></tr>`;
      return `<div class="stats"><strong>Clicks on this phone</strong><table>${rows}</table><p>Open this page with ?stats to view. Add analyticsId in the config for Google Analytics across all visitors.</p></div>`;
    }
    function bind() {
      document.querySelectorAll("[data-i]").forEach(btn => btn.onclick = () => { branch = CONFIG.branches[+btn.dataset.i]; render(); });
      const back = document.getElementById("back");
      if (back) back.onclick = () => { branch = null; render(); };
      document.querySelectorAll("[data-platform]").forEach(a => a.addEventListener("click", () => track(a.dataset.platform, branch ? branch.id : "")));
    }
    if (CONFIG.analyticsId) {
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + CONFIG.analyticsId;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ dataLayer.push(arguments); };
      gtag("js", new Date());
      gtag("config", CONFIG.analyticsId);
    }
    render();
  </script>
</body>
</html>
